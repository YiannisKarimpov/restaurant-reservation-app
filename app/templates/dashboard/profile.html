{% extends "base.html" %}

{% block title %}Profile - Restaurant Reservation{% endblock %}

{% block content %}
<section class="dashboard-section">
    <div class="container">
        <div class="dashboard-header">
            <h1>Your Profile</h1>
        </div>

        <div class="profile-card">
            <h2>Account Information</h2>
            <div class="profile-info">
                <div class="info-item">
                    <label>Username</label>
                    <p>{{ user.username }}</p>
                </div>
                <div class="info-item">
                    <label>Email</label>
                    <p>{{ user.email }}</p>
                </div>
                <div class="info-item">
                    <label>Member Since</label>
                    <p>{{ user.created_at.strftime('%B %d, %Y') }}</p>
                </div>
            </div>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>
</section>
{% endblock %}
